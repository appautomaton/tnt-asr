[project]
name = "automaton-tnt"
version = "0.1.1"
description = "TNT voice-to-text TUI with Qwen3-ASR on the Apple GPU via MLX"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
keywords = ["asr", "speech-to-text", "voice", "tui", "mlx", "apple-silicon", "qwen"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "numpy>=2.0",
    "sounddevice>=0.5; sys_platform != 'darwin'",
    "textual>=3.0",
    "mlx-speech>=0.4.3; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[project.urls]
Homepage = "https://github.com/appautomaton/tnt-asr"
Repository = "https://github.com/appautomaton/tnt-asr"
Issues = "https://github.com/appautomaton/tnt-asr/issues"
"Speech runtime (mlx-speech)" = "https://github.com/appautomaton/mlx-speech"
"Model checkpoint" = "https://huggingface.co/appautomaton/qwen3-asr-1.7b-bf16-mlx"
"Hugging Face" = "https://huggingface.co/appautomaton"

[project.scripts]
tnt = "tnt.app:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.11",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tnt"]
